name: ring-2-cook

# Real cold q11 cook exceeds J186's ten-second case budget.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ring-2-cook.yml'
      - '.github/actions/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'public/**'
      - 'lint/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'vitest.config.*'
      - '.npmrc'
      - '.gitattributes'
      - '.oxlintrc.author.json'
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      engine:
        description: Exact candidate engine commit (empty keeps the pin)
        type: string
        default: ''
      sharddev:
        description: Exact candidate sharddev commit (empty keeps the pin)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ring-2-cook-${{ github.ref }}-${{ inputs.engine }}-${{ inputs.sharddev }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cook-play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: env.APP_CLIENT_ID != ''
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: project-wildshard
          permission-contents: read
      - name: Read private org repos with the app token
        if: steps.app-token.outputs.token != ''
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base="https://x-access-token:${TOKEN}@github.com/"
          git config --global url."$base".insteadOf "https://github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"
          git config --global --add url."$base".insteadOf "ssh://git@github.com/"
      - name: Select exact candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev }}
        run: node scripts/select-candidate.mjs
      - name: Install pinned or candidate graph
        env:
          CANDIDATE_ENGINE: ${{ inputs.engine }}
          CANDIDATE_SHARDDEV: ${{ inputs.sharddev }}
        run: |
          if [ -n "$CANDIDATE_ENGINE$CANDIDATE_SHARDDEV" ]; then
            pnpm install --no-frozen-lockfile
          else
            pnpm install --frozen-lockfile
          fi
      - name: Build this repo's real shard
        run: pnpm build:shards
      - name: Cook, grapple and restore from server files
        run: node --test test/ci/cook-play.test.mjs
